<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".7">
      <stop offset="0" stop-color="#3a050c"/>
      <stop offset="1" stop-color="#070000"/>
    </radialGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".25" stop-color="#ff3d5e"/>
      <stop offset="1" stop-color="#dc143c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Arcs de mouvement -->
  <g fill="none" stroke-linecap="round">
    <path d="M110 330 A 220 220 0 0 1 300 90" stroke="#dc143c" stroke-opacity=".25" stroke-width="18"/>
    <path d="M490 330 A 220 220 0 0 0 300 90" stroke="#8b0000" stroke-opacity=".35" stroke-width="18"/>
  </g>
  <!-- Épée lourde -->
  <g transform="rotate(-40 300 200)">
    <rect x="292" y="30" width="16" height="230" fill="#9ca3af"/>
    <path d="M292 30 L300 8 308 30Z" fill="#9ca3af"/>
    <rect x="296" y="40" width="3" height="210" fill="#e5e7eb"/>
    <rect x="255" y="258" width="90" height="12" fill="#2a0306"/>
    <rect x="293" y="270" width="14" height="50" fill="#1a0204"/>
    <circle cx="300" cy="328" r="10" fill="#dc143c"/>
  </g>
  <!-- Lame plasma -->
  <g transform="rotate(40 300 200)">
    <rect x="290" y="30" width="20" height="230" rx="10" fill="#dc143c" opacity=".45"/>
    <rect x="295" y="34" width="10" height="222" rx="5" fill="#ff8a9a"/>
    <rect x="270" y="258" width="60" height="10" fill="#2a0306"/>
    <rect x="292" y="268" width="16" height="55" fill="#0d0103"/>
  </g>
  <circle cx="300" cy="128" r="40" fill="url(#spark)"/>
  <g fill="#ff3d5e">
    <circle cx="340" cy="100" r="3"/><circle cx="260" cy="95" r="2"/><circle cx="355" cy="140" r="2"/><circle cx="245" cy="150" r="2.5"/>
  </g>
</svg>
